[project]
name = "traducteur-pdf"
version = "1.1.0"
description = "Traduit des PDF de cours en conservant exactement la mise en page."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.25"]

[project.optional-dependencies]
dev = ["ruff", "pyinstaller"]

[project.scripts]
traduire-pdf = "pdf_traducteur.cli:main"

[project.gui-scripts]
traducteur-pdf = "pdf_traducteur.gui:main"

[tool.setuptools]
packages = ["pdf_traducteur"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "SIM"]
ignore = ["B905"]  # zip() sans strict= : longueurs garanties par construction

[tool.ruff.lint.isort]
known-first-party = ["pdf_traducteur"]
